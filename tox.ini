[tox]
envlist = py3, flake8, black, isort

[testenv]
deps =
  pytest-cov
usedevelop=True
commands =
  pytest -v --debug --override-ini junit_family=xunit1 --junit-xml=xunit-{envname}.xml --cov=debbuild --cov-report xml:coverage-{envname}.xml

[testenv:format]
deps = .[dev]
commands = 
  black src
  isort src
skip_install = true

[testenv:lint]
deps = .[dev]
commands = 
  black --check --diff src
  isort --check --diff src
  flake8 src
skip_install = true

[testenv:changelog]
deps =
  git-changelog==2.9.7
commands =
  git-changelog
skip_install = true

[testenv:release]
deps =
  git-changelog==2.9.7
allowlist_externals =
  sh
  git
commands =
  git-changelog --bump auto {posargs}
  # Create git commit and tag
  git add CHANGELOG.md debian/changelog
  sh -c 'git commit -m "Releasing version $(git-changelog --bump {posargs:auto} --bumped-version)."'
  sh -c 'git tag -m "Tagging version $(git-changelog --bump {posargs:auto} --bumped-version)." $(git-changelog --bump {posargs:auto} --bumped-version)'
skip_install = true

[flake8]
ignore =
  # whitespace before ':'
  E203
  # line too long (86 > 79 characters)
  E501
  # line break before binary operator
  W503
  # ambiguous variable name 'I'
  E741
filename =
  *.py
max-complexity = 20
